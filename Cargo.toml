[workspace]
resolver = "2"
members = [
    "crates/knocode-core",
    "crates/knocode-daemon",
    "crates/knocode-cli",
    "crates/knocode-repo-intel",
    "crates/knocode-knowledge",
    "crates/knocode-context",
    "crates/knocode-optimizer",
    "crates/knocode-events",
    "crates/knocode-storage",
    "crates/knocode-bench",
]

[workspace.package]
# ── VERSION SINGLE SOURCE OF TRUTH ─────────────────────────────────────
# This is THE version of knocode. All crates inherit it (version.workspace = true);
# /health + daemon banner derive it at compile time (CARGO_PKG_VERSION); the npm
# plugin consumes it via packages/opencode-knocode/scripts/sync-version.mjs on build.
# To release: change this line, run scripts/compile.ps1, then tag vX.Y.Z and push.
version = "0.9.11"
edition = "2021"
license = "MIT"

[workspace.lints.rust]
linker_messages = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(windows_raw_dylib)'] }

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
hmac = "0.12"
sha2 = "0.10"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "registry"] }
tracing-appender = "0.2"

# Errors
anyhow = "1"
thiserror = "2"

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
glob = "0.3"

# Database
rusqlite = { version = "0.40", features = ["bundled"] }

# IPC
rmp-serde = "1"

# Token counting (spec §3 — tiktoken-rs, never via model API)
tiktoken-rs = "0.12"

# CLI
clap = { version = "4", features = ["derive"] }

# External tools — first-class (v0.5.0): notify/git2 (ort is per-crate optional)
notify = "6"
git2 = "0.21"

# Structural search — ast-grep pattern matching (Level 3 retrieval)
ast-grep-core = "0.45"
ast-grep-language = "0.45"

# Internal crates
knocode-core = { path = "crates/knocode-core" }
knocode-events = { path = "crates/knocode-events" }
knocode-storage = { path = "crates/knocode-storage" }
knocode-repo-intel = { path = "crates/knocode-repo-intel" }
knocode-knowledge = { path = "crates/knocode-knowledge" }
knocode-context = { path = "crates/knocode-context" }
knocode-optimizer = { path = "crates/knocode-optimizer" }
knocode-daemon = { path = "crates/knocode-daemon" }
knocode-cli = { path = "crates/knocode-cli" }

# ── Disk space optimization ────────────────────────────────────────────────
[profile.dev]
debug = false          # no DWARF debug info (saves ~30-50% of target/)
incremental = false    # no incremental cache (saves ~2-4 GB, slightly slower rebuilds)

[profile.dev.package."*"]
debug = false          # no debug info for dependencies either
