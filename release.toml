# Release Configuration for Knocode
# 
# Usage:
#   cargo install cargo-release
#   cargo release patch   # 0.1.0 -> 0.1.1
#   cargo release minor   # 0.1.0 -> 0.2.0
#   cargo release major   # 0.1.0 -> 1.0.0

# Release configuration
[workspace.metadata.release]
# Create git tag
tag = true
# Tag format
tag-prefix = "v"
# Commit message format
tag-message = "Release {{version}}"
# Publish to crates.io (set to true when ready)
publish = false
# Push to remote
push-remote = "origin"
# Pre-release hooks: run tests, clippy, then audit.
# TOML keeps only the LAST value of a duplicate key, so the three checks were silently
# reduced to `cargo audit` — chain them into a single hook instead.
pre-release-hook = ["bash", "-c", "cargo test --workspace && cargo clippy --workspace -- -D warnings && cargo audit"]
# Update changelog
update-changelog = true
# Changelog path
changelog-path = "CHANGELOG.md"
# Sign git tag (optional, requires GPG)
# sign-tag = true
# Sign commits (optional, requires GPG)
# sign-commit = true

# Workspace settings
[workspace]
# Version to release (must match workspace.package.version in Cargo.toml)
version = "0.9.12"
# Release profile
profile = "release"
