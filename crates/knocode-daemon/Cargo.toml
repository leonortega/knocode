[package]
name = "knocode-daemon"
version.workspace = true
edition.workspace = true

[[bin]]
name = "knocode-daemon"
path = "src/main.rs"

[dependencies]
knocode-core.workspace = true
knocode-events.workspace = true
knocode-storage.workspace = true
knocode-repo-intel = { workspace = true, features = ["fs-watcher"] }
knocode-knowledge.workspace = true
knocode-context.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
anyhow.workspace = true
rmp-serde.workspace = true
serde.workspace = true
axum = "0.8"
serde_json = "1"
dunce = "1"
uuid = { version = "1", features = ["v4"] }
sha2.workspace = true
chrono.workspace = true
prometheus = { version = "0.14", optional = true }

[features]
default = []

# Windows version resource (ProductName/CompanyName/FileVersion/...) so the exe
# is not a metadata-less PE — a strong heuristic/AV-false-positive trigger.
# Deliberately an UNCONDITIONAL build-dependency: cargo evaluates cfg() filters
# in build-dependencies against the HOST, so `[target.'cfg(windows)'.build-dependencies]`
# leaves the crate unbuilt on Linux/macOS runners and build.rs then fails to
# compile (E0433). Whether the resource is actually EMBEDDED is decided at
# runtime in build.rs via CARGO_CFG_TARGET_OS (the target, not the host).
[build-dependencies]
winresource = "0.1"
