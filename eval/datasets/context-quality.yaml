# Context Quality Evaluation Dataset
# Exercises the context-quality provider's output contract.
# - "daemon-path" tests use only real-API vars (task, files_mentioned) and run
#   against the live daemon when KNOCODE_DAEMON_URL is reachable.
# - "mock-contract" tests inject simulated inputs (knowledge_entries,
#   large_file_count) that only the mock engine understands.

# daemon-path: mentioned files land in code_context
- description: "Context includes mentioned files"
  vars:
    task: "implement a new function in src/auth.rs"
    files_mentioned: "src/auth.rs,src/config.rs"
  assert:
    - type: contains
      value: "src/auth.rs"

# daemon-path + mock: token usage always reported
- description: "Context respects token budget"
  vars:
    task: "explain the codebase"
    max_tokens: 5000
  assert:
    - type: contains
      value: "total_tokens"

# mock-contract: knowledge entries land in docs_context
- description: "Context includes knowledge entries in docs_context"
  vars:
    task: "use snake_case for variables"
    knowledge_entries: "naming_convention:Use snake_case"
  assert:
    - type: contains
      value: "naming_convention"

# daemon-path + mock: empty query stays graceful (zeros, not an error)
- description: "Context handles empty query gracefully"
  vars:
    task: ""
  assert:
    - type: contains
      value: "total_tokens"

# mock-contract: large content is truncated to the budget
- description: "Context truncates large content to the token budget"
  vars:
    task: "show me everything"
    large_file_count: 100
    max_tokens: 5000
  assert:
    - type: contains
      value: "total_tokens"

# daemon-path + mock: usage breakdown by source
- description: "Context reports token usage by source"
  vars:
    task: "implement a new feature"
  assert:
    - type: contains
      value: "by_source"

# mock-contract: multiple knowledge entries
- description: "Context handles multiple knowledge entries"
  vars:
    task: "follow the project conventions"
    knowledge_entries: "convention:Use TypeScript strict mode,pattern:Use functional components"
  assert:
    - type: contains
      value: "convention"

# daemon-path: multiple mentioned files
- description: "Context includes multiple mentioned files"
  vars:
    task: "implement authentication with rate limiting"
    files_mentioned: "src/auth.rs,src/ratelimit.rs"
  assert:
    - type: contains
      value: "src/ratelimit.rs"
